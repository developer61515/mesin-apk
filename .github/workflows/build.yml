name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'AplikasiKu'
      app_url:
        description: 'URL Website'
        required: true
        default: 'https://google.com'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Android
        run: |
          mkdir myapp && cd myapp
          npm init -y
          npm install @capacitor/core
          npm install -D @capacitor/cli
          
          # Membuat folder web dasar
          mkdir www
          echo "Memuat Aplikasi..." > www/index.html
          
          # Setup Capacitor
          npx cap init "${{ github.event.inputs.app_name }}" "com.web2apk.studio" --web-dir www
          
          # Hubungkan APK ke URL Web Kamu
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.web2apk.studio",
            "appName": "${{ github.event.inputs.app_name }}",
            "webDir": "www",
            "server": {
              "url": "${{ github.event.inputs.app_url }}",
              "cleartext": true
            }
          }
          EOF
          
          # Tambah sistem Android dan Compile APK
          npm install @capacitor/android
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: myapp/android/app/build/outputs/apk/debug/app-debug.apk
